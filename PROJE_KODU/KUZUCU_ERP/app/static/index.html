ht:700;border-top:2px solid #c8d8c5}.stock-in{color:#126a46;font-weight:600}.stock-out{color:#a34823;font-weight:600}.stock-controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 16px}.stock-controls label{min-width:160px}.stock-controls select{max-width:none}.stock-quantity{font-variant-numeric:tabular-nums}textarea{font:inherit;padding:10px;border:1px solid #cbd9cf;border-radius:7px;min-width:200px;max-width:400px;resize:vertical}.stock-footer{margin-top:22px;border-top:2px solid #b5c6b9;padding-top:16px}.due-banner{margin-bottom:16px;padding:14px 16px;border-radius:10px;background:#fff1d5;border:1px solid #e2bb6f;color:#6d4617;display:none}.due-banner button{padding:7px 11px;background:#633d16;color:white;border:0;border-radius:7px;margin-left:12px}.status-pill{display:inline-block;padding:4px 9px;border-radius:20px;font-size:12px;background:#e8eeea;color:#375043}.status-pill.due{background:#ffdeb5;color:#7e3605}.status-pill.completed{background:#dceedd;color:#21612c}.reminder-actions{display:flex;flex-wrap:wrap;gap:5px}.agenda-card{border:1px solid #dde9dc;border-radius:10px;background:#fafcf8;padding:16px}.agenda-note{font-size:13px;color:#62786a;margin:4px 0 0}

</style><link rel="stylesheet" href="/static/health.css?v=014"><link rel="stylesheet" href="/static/extensions.css?v=014"></head><body><header><img src="/static/kuzucu_logo.png" alt="Kuzucu ERP logo" class="brandlogo"><span><b>KUZUCU ERP</b><small>Besi · Tarla · Yem · Stok · Belgeler · Pilot v0.14</small></span></header><div class="layout"><aside><nav id="nav"></nav></aside><main><div id="message"></div><div id="reminderBanner" class="due-banner" role="status"></div><div id="content"></div></main></div><script src="/static/health.js?v=014"></script><script src="/static/calves.js?v=014"></script><script src="/static/parcels.js?v=014"></script><script src="/static/security-ui.js?v=014"></script><script>
const sections=[['dashboard','Genel Bakış'],['pens','Padoklar'],['animals','Hayvanlar'],['calves','Buzağı Giriş / Çıkış'],['animal-health','Sağlık / Tedaviler'],['weighings','Tartımlar'],['fields','Parseller'],['seasons','Üretim Sezonları'],['items','Stok Ürünleri'],['stock','Stok Hareketleri'],['firms','Firmalar / Cariler'],['reminders','Ajanda / Hatırlatmalar'],['reports','Akıllı Raporlar'],['integrations','Entegrasyonlar'],['documents','Fotoğraf / PDF Okuma'],['users','Kullanıcılar ve Yetkiler'],['audit','İşlem Geçmişi']];let active='dashboard';
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function humanError(d){if(!d||!('detail' in d))return 'İşlem sırasında sorun oluştu. Tekrar deneyin.';if(typeof d.detail==='string')return d.detail;if(d.detail&&typeof d.detail==='object'&&!Array.isArray(d.detail))return d.detail.message||'Girdi kontrolü nedeniyle kayıt durduruldu.';if(Array.isArray(d.detail))return d.detail.map(x=>{const field=(x.loc||[]).slice(-1)[0];const labels={quantity:'Miktar',start_date:'Başlangıç tarihi',remind_time:'Hatırlatma saati',title:'Başlık',tax_no:'Vergi numarası',entry_weight_kg:'Giriş kilosu',area_decare:'Dekar',name:'Ad / isim',reason:'Düzeltme nedeni'};return `${labels[field]||field||'Bilgi'}: ${x.msg||'Hatalı giriş'}`}).join(' · ');return 'Girdi kontrolünde hata oluştu. Alanları gözden geçirin.'}
async function api(url,opt={}){
 const method=(opt.method||'GET').toUpperCase();const changing=!['GET','HEAD'].includes(method);
 const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(changing?authHeaders({}):{}),...(opt.headers||{})}});
 let d={};try{d=await r.json()}catch(_e){}
 if(!r.ok){if(r.status===401&&erpSession){erpSession=null;authScreen(false,'Oturumunuz sona erdi. Yeniden giriş yapın.')};throw Error(humanError(d))}
 if(changing&&!url.startsWith('/api/auth/drafts/'))await clearSubmittedDraft();
 return d
}
function message(s,isError=false){const e=document.querySelector('#message');e.textContent=s;e.className=isError?'error':'';e.style.display='block';setTimeout(()=>e.style.display='none',5000)}
// API'den gelen sayilar SQL ondalik bicimindedir (30000.000). 'tr-TR' sadece gorunum icin.
function fmtDbQuantity(value){const s=String(value??'').trim();if(!/^-?\d+(?:\.\d+)?$/.test(s))return '—';const neg=s.startsWith('-')?'-':'';const parts=s.replace(/^-/, '').split('.');const whole=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');const frac=(parts[1]||'').replace(/0+$/,'');return neg+whole+(frac?','+frac:'')}
// Kullanicinin yazdigi 30.000,500 -> 30000.500; API'ye binlik ayirici gitmez.
function fmtTrEntry(raw){const cleaned=String(raw||'').replace(/[^0-9,]/g,'');const parts=cleaned.split(',');const integer=(parts[0]||'').replace(/^0+(?=\d)/,'');const grouped=integer.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return grouped+(parts.length>1?','+parts.slice(1).join('').slice(0,3):'')}
function canonicalQuantity(raw){const s=String(raw).trim().replace(/\./g,'').replace(',','.');if(!/^(?:\d+)(?:\.\d{1,3})?$/.test(s)||!Number.isFinite(Number(s))||Number(s)<=0)throw Error('Miktar sıfırdan büyük olmalı. Örnek: 30.000 veya 12.500,50');return s}
function dateTr(value){return /^\d{4}-\d{2}-\d{2}$/.test(String(value||''))?String(value).split('-').reverse().join('.'):escapeHTML(value||'—')}
function freqLabel(value){return ({once:'Tek sefer',daily:'Her gün',weekly:'Her hafta',monthly:'Her ay'})[value]||value}
function statusLabel(value){return ({due:'Zamanı geldi',upcoming:'Planlandı',completed:'Tamamlandı',paused:'Durduruldu'})[value]||value}
function reminderRowsHtml(rows){return rows.length?rows.map(r=>`<tr><td><strong>${escapeHTML(r.title)}</strong><div class="agenda-note">${escapeHTML(r.notes||'')}</div></td><td>${escapeHTML(r.category)}</td><td>${escapeHTML(freqLabel(r.frequency))}</td><td>${r.next_due_date?dateTr(r.next_due_date)+' '+escapeHTML(r.remind_time):'—'}</td><td><span class="status-pill ${escapeHTML(r.status)}">${escapeHTML(statusLabel(r.status))}</span></td><td><div class="reminder-actions">${r.due?`<button class="secondary-action" type="button" data-complete-reminder="${Number(r.id)}">Tamamlandı</button>`:''}<button class="secondary-action" type="button" data-edit-reminder="${Number(r.id)}">Düzenle</button><button class="secondary-action" type="button" data-toggle-reminder="${Number(r.id)}">${r.is_active?'Durdur':'Etkinleştir'}</button><button class="secondary-action" type="button" data-delete-reminder="${Number(r.id)}">Sil</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Henüz ajanda kaydı yok.</td></tr>'}
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function refreshDue(){try{const due=await api('/api/reminders/due'),banner=document.querySelector('#reminderBanner'),btn=document.querySelector('nav button[data-key="reminders"]');if(btn)btn.textContent=`Ajanda / Hatırlatmalar${due.length?' ('+due.length+')':''}`;if(!due.length){banner.style.display='none';banner.innerHTML='';return}banner.style.display='block';banner.innerHTML=`<strong>⏰ ${due.length} hatırlatmanızın zamanı geldi.</strong> <span>${escapeHTML(due.slice(0,3).map(r=>r.title).join(' · '))}</span> <button type="button" id="openAgendaBtn">Ajandayı aç</button>`;document.querySelector('#openAgendaBtn').onclick=()=>{active='reminders';render()}}catch(_e){/* yerel sunucu geçici olarak kapalı olabilir */}}
function checkLargeStock(quantity,item_id,movement_date,editing=false){const n=Number(quantity);const today=localToday();if(movement_date>today&&!confirm('Hareket tarihi gelecekte. Bu tarihi kullanarak kaydetmek istiyor musunuz?'))return false;if(n>=1000000&&!confirm(`Dikkat: ${fmtDbQuantity(quantity)} tutarında stok ${editing?'düzeltmesi':'hareketi'} yapılıyor. Miktarı kontrol ettiniz mi?`))return false;return true}
function stockGroupsHtml(history,filter='',ascending=false){let groups=history.groups.filter(g=>g.movements.length&&(!filter||String(g.item_id)===String(filter)));if(!groups.length)return '<p class="muted">Seçilen ürün için henüz stok hareketi yok.</p>';return groups.map(g=>{const rows=[...g.movements].sort((a,b)=>ascending?(a.movement_date||'').localeCompare(b.movement_date||'')||a.id-b.id:(b.movement_date||'').localeCompare(a.movement_date||'')||b.id-a.id);return `<section class="stock-item-group"><h3>${escapeHTML(g.name)} <small class="muted">(${escapeHTML(g.code)})</small></h3><div class="scroll"><table><thead><tr><th>Tarih</th><th>Belge / Referans</th><th>Hareket</th><th>Giriş</th><th>Çıkış</th><th>İşlemi Yapan</th><th>Düzenle</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${dateTr(m.movement_date)}</td><td>${escapeHTML(m.reference||'—')}</td><td>${m.type==='IN'?'Giriş':'Çıkış'}</td><td class="stock-quantity stock-in">${m.type==='IN'?fmtDbQuantity(m.quantity)+' '+escapeHTML(g.unit):'—'}</td><td class="stock-quantity stock-out">${m.type==='OUT'?fmtDbQuantity(m.quantity)+' '+escapeHTML(g.unit):'—'}</td><td>${escapeHTML(m.created_by||'Eski kayıt')}</td><td><button class="secondary-action" type="button" data-edit-stock="${Number(m.id)}">Düzenle</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">ÜRÜN TOPLAMI</td><td>${fmtDbQuantity(g.incoming)} ${escapeHTML(g.unit)}</td><td>${fmtDbQuantity(g.outgoing)} ${escapeHTML(g.unit)}</td><td colspan="2">—</td></tr><tr><td colspan="3">KALAN STOK</td><td colspan="4">${fmtDbQuantity(g.balance)} ${escapeHTML(g.unit)}</td></tr></tfoot></table></div></section>`}).join('')}
function stockTotalFooter(history,filter=''){const rows=filter?history.groups.filter(g=>String(g.item_id)===String(filter)).map(g=>({unit:g.unit,incoming:g.incoming,outgoing:g.outgoing,balance:g.balance})):history.unit_totals;return `<div class="stock-footer"><h3>GENEL TOPLAM (BİRİM BAZINDA)</h3>${rows.length?`<div class="scroll"><table><thead><tr><th>Birim</th><th>Toplam Giriş</th><th>Toplam Çıkış</th><th>Kalan Stok</th></tr></thead><tbody>${rows.map(v=>`<tr><td>${escapeHTML(v.unit)}</td><td>${fmtDbQuantity(v.incoming)} ${escapeHTML(v.unit)}</td><td>${fmtDbQuantity(v.outgoing)} ${escapeHTML(v.unit)}</td><td><strong>${fmtDbQuantity(v.balance)} ${escapeHTML(v.unit)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Toplam hesaplanacak hareket bulunamadı.</p>'}<p class="muted">Kg, ton ve adet birbirine eklenmez; her birimin toplamı ayrı gösterilir.</p></div>`}
let stockItemFilter='', stockSort='desc';
function firmRowsHtml(rows){return rows.length?rows.map(f=>`<tr><td>${escapeHTML(f.name)}</td><td>${escapeHTML(f.tax_no||'—')}</td><td>${escapeHTML(f.phone||'—')}</td><td style="max-width:300px;white-space:pre-wrap">${escapeHTML(f.address||'—')}</td><td><button type="button" class="secondary-action" data-edit-firm="${Number(f.id)}">Düzenle</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Henüz firma kaydı yok.</td></tr>'}
function attachTrQuantityFormatter(el){if(!el)return;el.addEventListener('input',()=>{const pos=el.selectionStart,prefix=el.value.slice(0,pos),formatted=fmtTrEntry(el.value),cursor=fmtTrEntry(prefix).length;el.value=formatted;el.setSelectionRange(cursor,cursor)})}
function table(rows,cols){return `<div class="scroll"><table><thead><tr>${cols.map(x=>`<th>${escapeHTML(x[1])}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${escapeHTML(r[c[0]])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="muted">Henüz kayıt yok.</td></tr>`}</tbody></table></div>`}
function form(id,inputs,label='Kaydet'){return `<form id="${id}">${inputs.map(i=>`<label>${i.label}${i.type==='stockQuantity'?`<input name="${i.name}" type="text" inputmode="decimal" placeholder="30.000 veya 12.500,50" autocomplete="off" required>`:i.type==='select'?`<select name="${i.name}" required>${i.opts.map(o=>`<option value="${escapeHTML(o.value)}">${escapeHTML(o.label)}</option>`).join('')}</select>`:`<input name="${i.name}" type="${i.type||'text'}" ${i.type==='number'?'step="any" min="0.001"':''} ${i.type==='date'?`value="${new Date().toISOString().slice(0,10)}"`:''} ${i.optional?'':'required'}>`}</label>`).join('')}<button>${label}</button></form>`}
function inp(name,label,type='text',optional=false){return {name,label,type,optional}}
async function bindForm(id,url){document.getElementById(id).onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const k of Object.keys(data))if(['capacity','pen_id','field_id','year','animal_id','item_id'].includes(k))data[k]=Number(data[k]);try{await api(url,{method:'POST',body:JSON.stringify(data)});message('Kayıt başarıyla eklendi.');render()}catch(err){message(err.message,true)}}}
async function render(){if(!erpSession)return; if(!sectionAllowed(active)){active=sections.find(([k])=>sectionAllowed(k))?.[0]||'';} document.querySelector('#nav').innerHTML=sections.filter(([k])=>sectionAllowed(k)).map(([k,v])=>`<button class="${k===active?'active':''}" data-key="${k}">${v}</button>`).join('');document.querySelectorAll('[data-key]').forEach(e=>e.onclick=()=>{active=e.dataset.key;render()});let h='';try{
if(active==='users'){h=await usersScreenHtml()}
if(active==='audit'){h=await auditScreenHtml()}
if(active==='reminders'){
 const records=await api('/api/reminders');window.__reminderRows=records;
 h=`<h1>Ajanda ve Hatırlatmalar</h1><p class="sub">Tek seferlik, her gün, her hafta veya her ay tekrarlayan işlerinizi takip edin. Hatırlatmalar program açıkken ekranda görünür; program kapalıyken telefon veya e-posta bildirimi gönderilmez.</p><div class="panel"><h3>Yeni Hatırlatma / Düzenleme</h3><form id="reminderForm"><input type="hidden" name="id"><label>Hatırlatma başlığı<input name="title" maxlength="180" placeholder="Örn. Buzağı mama kontrolü" required></label><label>Bölüm<select name="category"><option>Genel</option><option>Tarım</option><option>Besi</option><option>Buzağı</option><option>Stok</option><option>Personel</option><option>Finans</option></select></label><label>Tekrar<select name="frequency"><option value="once">Tek sefer</option><option value="daily">Her gün</option><option value="weekly">Her hafta</option><option value="monthly">Her ay</option></select></label><label>Başlangıç tarihi<input name="start_date" type="date" required></label><label>Hatırlatma saati<input name="remind_time" type="time" value="09:00" required></label><label>Notlar<textarea name="notes" rows="2" maxlength="1000" placeholder="Görev açıklaması / yapılacak işler"></textarea></label><button id="saveReminderBtn" type="submit">Hatırlatmayı Kaydet</button><button id="cancelReminderEdit" type="button" class="secondary-action" style="display:none">Düzenlemeyi İptal</button></form><p class="muted">Aylık tekrarlar aynı gün için yapılır; örneğin ayın 31'i olmayan aylarda o ayın son günü kullanılır. <strong>Tamamlandı</strong> dediğinizde bir sonraki tekrar tarihi otomatik hesaplanır.</p></div><div class="panel"><h3>Hatırlatma Listesi</h3><div class="scroll"><table><thead><tr><th>İş / Açıklama</th><th>Bölüm</th><th>Tekrar</th><th>Sıradaki zaman</th><th>Durum</th><th>İşlemler</th></tr></thead><tbody>${reminderRowsHtml(records)}</tbody></table></div></div>`;
}

if(active==='reports'){
let lastQuery='';
document.querySelector('#reportForm').onsubmit=async e=>{e.preventDefault();const q=document.querySelector('#reportQuery').value;try{const r=await api('/api/reports/query',{method:'POST',body:JSON.stringify({query:q})});lastQuery=q;document.querySelector('#reportResult').innerHTML=`<h3>${escapeHTML(r.title)} (${r.row_count} kayıt)</h3>`+table(r.rows.map(x=>Object.fromEntries(r.columns.map((k,i)=>[k,x[i]]))),r.columns.map(k=>[k,k]));document.querySelector('#reportExport').style.display=right((r.scope||'reports.summary')+'.export')?'inline-block':'none'}catch(err){document.querySelector('#reportResult').textContent=err.message;document.querySelector('#reportExport').style.display='none'}};
document.querySelector('#reportExport').onclick=async()=>{const r=await fetch('/api/reports/export.csv',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({query:lastQuery})});if(!r.ok){message('Rapor indirilemedi',true);return}const blob=await r.blob(),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='kzc_rapor.csv';a.click();URL.revokeObjectURL(url)};
}
let routes={pens:'/api/pens',animals:'/api/animals',fields:'/api/fields',seasons:'/api/seasons',items:'/api/items',stock:'/api/stock-movements'};if(document.querySelector('#entry')){if(active==='weighings'){document.querySelector('#entry').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{await api(`/api/animals/${Number(d.animal_id)}/weighings`,{method:'POST',body:JSON.stringify({measured_at:d.measured_at,weight_kg:d.weight_kg})});message('Tartım kaydedildi.');render()}catch(err){message(err.message,true)}}}else if(active==='stock'){document.querySelector('#entry').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));try{data.item_id=Number(data.item_id);data.quantity=canonicalQuantity(data.quantity);if(!checkLargeStock(data.quantity,data.item_id,data.movement_date))return;await api('/api/stock-movements',{method:'POST',body:JSON.stringify(data)});message('Stok hareketi kaydedildi.');render()}catch(err){message(err.message,true)}}}else bindForm('entry',routes[active])}
// The backend always enforces permissions; avoid showing misleading edit buttons.
const mod=navScopes[active]?.replace(/\.view$/,'');
if(mod&&!right(mod+'.create')){
  for(const selector of ['#entry','#animalForm','#calfForm','#calfBulkForm','#calfExitForm','#calfConsumeForm','#calfWeighForm','#firmEntryForm','#reminderForm','#healthCaseForm','#healthCatalogAddForm','#healthLogForm']){
    const el=document.querySelector(selector);if(el)el.style.display='none';
  }
}
if(mod&&!right(mod+'.edit')){
  document.querySelectorAll('[data-animal-edit],[data-edit-stock],[data-edit-firm],[data-calf-edit],[data-edit-reminder],[data-health-edit]').forEach(el=>el.style.display='none');
}
await mountDrafts();
}catch(err){document.querySelector('#content').innerHTML=`<h2>İşlem açılamadı</h2><p>${escapeHTML(err.message)}</p>`}}
initERP();
setInterval(()=>{if(erpSession&&right('ajanda.view'))refreshDue()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&erpSession&&right('ajanda.view'))refreshDue()});
</script></body></html>
